<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Calendar — Travel Distribution Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --sk: #eaeeef; --shine: #f4f6f7; --border: #e5e7eb; }
    body { font-family: 'Lato', sans-serif; background: #f4f6f7; }

    @keyframes shimmer {
      0%   { background-position: -800px 0; }
      100% { background-position:  800px 0; }
    }
    .sk {
      background: linear-gradient(90deg, var(--sk) 25%, var(--shine) 50%, var(--sk) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.6s infinite linear;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .topbar {
      position: sticky; top: 0; z-index: 100; height: 52px;
      background: #fff; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 16px;
    }
    .topbar-left  { display: flex; align-items: center; gap: 20px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .breadcrumb-bar {
      height: 40px; background: #fff; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 24px; gap: 8px;
    }

    .layout { display: flex; min-height: calc(100vh - 92px); }

    .sidebar {
      width: 220px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border);
      padding: 16px 12px; display: flex; flex-direction: column; gap: 6px;
    }

    .main { flex: 1; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 24px; }

    .section-card {
      background: #fff; border: 1px solid var(--border); border-radius: 8px;
      padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;
    }

    /* Weekly topbar inside card */
    .wv-topbar-sk {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .wv-topbar-left-sk { display: flex; align-items: center; gap: 10px; }
    .wv-topbar-right-sk { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* Weekly table grid */
    .wv-table {
      display: grid;
      grid-template-columns: 200px repeat(7, 1fr);
      gap: 1px;
      overflow-x: auto;
    }
    .wv-cell { display: flex; align-items: center; }
    .wv-day-hdr { height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
    .wv-section-row { height: 36px; background: rgba(234,238,239,0.35); display: flex; align-items: center; }
    .wv-data-row { height: 32px; display: flex; align-items: center; }
  </style>
</head>
