<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar — Travel Distribution Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --sk: #eaeeef; --shine: #f4f6f7; --border: #e5e7eb; }
    body { font-family: 'Lato', sans-serif; background: #f4f6f7; }

    @keyframes shimmer {
      0%   { background-position: -800px 0; }
      100% { background-position:  800px 0; }
    }
    .sk {
      background: linear-gradient(90deg, var(--sk) 25%, var(--shine) 50%, var(--sk) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.6s infinite linear;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .topbar {
      position: sticky; top: 0; z-index: 100; height: 52px;
      background: #fff; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 16px;
    }
    .topbar-left  { display: flex; align-items: center; gap: 20px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .breadcrumb-bar {
      height: 40px; background: #fff; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 24px; gap: 8px;
    }

    .layout { display: flex; min-height: calc(100vh - 92px); }

    .sidebar {
      width: 220px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border);
      padding: 16px 12px; display: flex; flex-direction: column; gap: 6px;
    }

    .main { flex: 1; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 24px; }

    .section-card {
      background: #fff; border: 1px solid var(--border); border-radius: 8px;
      padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;
    }
    .card-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .card-hdr-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* monthly */
    .cal-dow { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 2px; }
    .cal-weeks { display: flex; flex-direction: column; gap: 2px; }
    .cal-week  { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
    .cal-cell  { height: 72px; border-radius: 2px; }
    .faded     { opacity: 0.3; }

    /* weekly */
    .wk-grid { display: grid; grid-template-columns: 200px repeat(7,1fr); gap: 2px; }
    .wk-cell      { height: 32px; border-radius: 2px; }
    .wk-cell--hdr { height: 40px; }
    .wk-cell--sec { height: 36px; opacity: 0.55; }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="sk" style="width:24px;height:24px;border-radius:4px"></div>
    <div class="sk" style="width:80px;height:22px;border-radius:3px"></div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="sk" style="width:48px;height:14px"></div>
      <div class="sk" style="width:60px;height:14px;opacity:.4"></div>
      <div class="sk" style="width:110px;height:14px;opacity:.4"></div>
      <div class="sk" style="width:120px;height:14px;opacity:.4"></div>
      <div class="sk" style="width:64px;height:14px;opacity:.4"></div>
      <div class="sk" style="width:56px;height:14px;opacity:.4"></div>
      <div class="sk" style="width:140px;height:14px"></div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="sk" style="width:20px;height:20px;border-radius:50%"></div>
    <div class="sk" style="width:20px;height:20px;border-radius:50%"></div>
    <div class="sk" style="width:20px;height:20px;border-radius:50%"></div>
    <div class="sk" style="width:20px;height:20px;border-radius:50%"></div>
    <div class="sk" style="width:28px;height:28px;border-radius:50%"></div>
  </div>
</header>

<div class="breadcrumb-bar">
  <div class="sk" style="width:36px;height:12px"></div>
  <div class="sk" style="width:8px;height:8px;opacity:.3;border-radius:1px"></div>
  <div class="sk" style="width:140px;height:12px"></div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <div class="sk" style="width:16px;height:16px;border-radius:3px"></div>
    <div class="sk" style="width:90px;height:12px"></div>
    <div class="sk" style="width:12px;height:12px;opacity:.3;border-radius:1px"></div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sk" style="height:36px;border-radius:6px"></div>
    <div class="sk" style="height:36px;border-radius:6px;opacity:.4"></div>
    <div class="sk" style="height:36px;border-radius:6px;opacity:.4"></div>
    <div class="sk" style="height:36px;border-radius:6px;opacity:.4"></div>
  </aside>

  <main class="main">

    <!-- page header -->
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="sk" style="width:220px;height:28px;border-radius:3px"></div>
      <div style="display:flex;gap:10px">
        <div class="sk" style="width:200px;height:34px;border-radius:4px"></div>
        <div class="sk" style="width:160px;height:34px;border-radius:4px"></div>
      </div>
    </div>

    <!-- MONTHLY CALENDAR -->
    <div class="section-card">
      <div class="card-hdr">
        <div class="sk" style="width:80px;height:22px;border-radius:3px"></div>
        <div class="card-hdr-r">
          <div class="sk" style="width:110px;height:32px;border-radius:4px"></div>
          <div class="sk" style="width:140px;height:32px;border-radius:4px"></div>
          <div class="sk" style="width:90px;height:32px;border-radius:4px"></div>
          <div class="sk" style="width:80px;height:32px;border-radius:4px"></div>
          <div class="sk" style="width:80px;height:32px;border-radius:4px"></div>
          <div class="sk" style="width:130px;height:32px;border-radius:4px"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;gap:4px">
          <div class="sk" style="width:80px;height:30px;border-radius:4px"></div>
          <div class="sk" style="width:72px;height:30px;border-radius:4px;opacity:.4"></div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="sk" style="width:24px;height:24px;border-radius:4px"></div>
          <div class="sk" style="width:140px;height:14px"></div>
          <div class="sk" style="width:24px;height:24px;border-radius:4px"></div>
        </div>
      </div>
      <div style="display:flex;gap:16px">
        <div class="sk" style="width:130px;height:12px"></div>
        <div class="sk" style="width:90px;height:12px"></div>
        <div class="sk" style="width:100px;height:12px"></div>
        <div class="sk" style="width:60px;height:12px"></div>
        <div class="sk" style="width:50px;height:12px"></div>
        <div class="sk" style="width:90px;height:12px"></div>
      </div>

      <!-- 3-month grid -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px">

        <!-- Month 1 -->
        <div>
          <div class="sk" style="width:100px;height:14px;margin-bottom:10px"></div>
          <div class="cal-dow">
            <div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div>
          </div>
          <div class="cal-weeks">
            <div class="cal-week"><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div></div>
          </div>
        </div>

        <!-- Month 2 -->
        <div>
          <div class="sk" style="width:100px;height:14px;margin-bottom:10px"></div>
          <div class="cal-dow">
            <div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div>
          </div>
          <div class="cal-weeks">
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div></div>
          </div>
        </div>

        <!-- Month 3 -->
        <div>
          <div class="sk" style="width:100px;height:14px;margin-bottom:10px"></div>
          <div class="cal-dow">
            <div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div><div class="sk" style="height:20px"></div>
          </div>
          <div class="cal-weeks">
            <div class="cal-week"><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div></div>
            <div class="cal-week"><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div><div class="sk cal-cell faded"></div></div>
          </div>
        </div>

      </div>
    </div>

    <!-- WEEKLY VIEW -->
    <div class="section-card">
      <div class="card-hdr">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="sk" style="width:110px;height:20px;border-radius:3px"></div>
          <div class="sk" style="width:90px;height:22px;border-radius:3px"></div>
        </div>
        <div class="card-hdr-r">
          <div class="sk" style="width:110px;height:32px;border-radius:4px"></div>
          <div class="sk" style="width:100px;height:32px;border-radius:4px"></div>
          <div class="sk" style="width:80px;height:32px;border-radius:4px"></div>
          <div class="sk" style="width:140px;height:32px;border-radius:4px"></div>
          <div class="sk" style="width:100px;height:32px;border-radius:4px"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;gap:4px">
          <div class="sk" style="width:80px;height:30px;border-radius:4px;opacity:.4"></div>
          <div class="sk" style="width:72px;height:30px;border-radius:4px"></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="sk" style="width:90px;height:28px;border-radius:4px"></div>
          <div class="sk" style="width:90px;height:28px;border-radius:4px"></div>
          <div class="sk" style="width:24px;height:24px;border-radius:4px"></div>
          <div class="sk" style="width:24px;height:24px;border-radius:4px"></div>
        </div>
      </div>
      <div style="display:flex;gap:16px">
        <div class="sk" style="width:80px;height:12px"></div>
        <div class="sk" style="width:110px;height:12px"></div>
        <div class="sk" style="width:90px;height:12px"></div>
        <div class="sk" style="width:100px;height:12px"></div>
        <div class="sk" style="width:56px;height:12px"></div>
      </div>

      <div style="overflow-x:auto">
        <div class="wk-grid">
          <!-- header -->
          <div class="sk wk-cell wk-cell--hdr" style="opacity:.3"></div>
          <div class="sk wk-cell wk-cell--hdr"></div><div class="sk wk-cell wk-cell--hdr"></div><div class="sk wk-cell wk-cell--hdr"></div><div class="sk wk-cell wk-cell--hdr"></div><div class="sk wk-cell wk-cell--hdr"></div><div class="sk wk-cell wk-cell--hdr"></div><div class="sk wk-cell wk-cell--hdr"></div>
          <!-- section A -->
          <div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div>
          <div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div>
          <div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div>
          <div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div>
          <div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div>
          <!-- section B -->
          <div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div>
          <div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div>
          <div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div>
          <div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div>
          <div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div>
          <!-- section C -->
          <div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div><div class="sk wk-cell wk-cell--sec"></div>
          <div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div>
          <div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div>
          <div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div><div class="sk wk-cell"></div>
        </div>
      </div>
    </div>

  </main>
</div>
</body>
</html>
